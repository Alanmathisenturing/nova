name: NOVA CI

on:
  push:
    branches: ["main", "cfqp-v0.1", "implementation/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      # Bootstrap formatting on the ephemeral runner while the legacy workspace is normalized.
      # This does not commit formatting changes; strict format enforcement should be restored after
      # the formatted source has been committed.
      - run: cargo fmt --all
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo test --workspace --release
