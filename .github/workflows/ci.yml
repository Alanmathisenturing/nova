name: NOVA CI

on:
  push:
    branches: ["main", "cfqp-v0.1"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo test --workspace --release
